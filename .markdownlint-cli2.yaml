# Scope: the human-facing prose set. Agent execution material (skills/,
# agents/) follows agent conventions; datasets, results, templates, and the
# single-paragraph CHANGELOG are generated or historical material.
globs:
  - "**/*.md"

ignores:
  - "skills/**"
  - "agents/**"
  - ".github/**"
  - "evals/datasets/**"
  - "evals/results/**"
  - "evals/src/mightymodels_evals/templates/**"
  # gitignored build output: fixture repos regenerated by `mightymodels-evals fixtures`
  - "evals/fixtures/**"
  - "evals/staging/**"
  - "CHANGELOG.md"
  - "node_modules/**"
  - ".venv/**"
