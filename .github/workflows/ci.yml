name: Continuous Integration (CI)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  labeler:
    name: 📎 Label Pull Request
    runs-on: ubuntu-24.04
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply Labels (labeler.yml)
        id: apply-labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/labeler.yml
          sync-labels: true
          dot: true

      - if: ${{ !cancelled() }}
        shell: bash
        env:
          LABELER_OUTCOME: ${{ steps.apply-labels.outcome }}
          NEW_LABELS: ${{ steps.apply-labels.outputs.new-labels }}
          ALL_LABELS: ${{ steps.apply-labels.outputs.all-labels }}
        run: |
          format_labels() {
            local labels=${1:-} fallback=$2
            if [[ -z "$labels" ]]; then
              printf '%s\n' "$fallback"
              return 0
            fi
            tr ',' '\n' <<< "$labels" | sed "s/^[[:space:]]*/- \`/; s/[[:space:]]*\$/\`/"
          }

          if [[ -n "${NEW_LABELS:-}" ]]; then
            echo "::notice title=PR Labeler::Added labels: ${NEW_LABELS}"
          fi

          {
            printf '%s\n' '## Pull Request Labels' ''
            if [[ "${LABELER_OUTCOME:-}" != 'success' ]]; then
              printf '%s\n' ':warning: The labeler step did not succeed — label state below may be incomplete.' ''
            fi
            printf '%s\n' '### Labels Added' ''
            format_labels "${NEW_LABELS:-}" '_No new labels._'
            printf '%s\n' '' '### Current PR Labels' ''
            format_labels "${ALL_LABELS:-}" 'No labels found.'
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality Suite (Pre-Commit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap
        uses: ./.github/actions/bootstrap

      - name: Run pre-commit
        id: pre-commit
        run: uv run pre-commit run --all-files

      - name: Run tests
        run: scripts/quality.sh --test

      - if: ${{ failure() && !cancelled() && steps.pre-commit.outcome == 'failure' }}
        shell: bash
        run: |
          echo ":x:One or more step(s) failed" >> "${GITHUB_STEP_SUMMARY}"
          echo "::error::The pre-commit check failed, make sure it's installed"
          exit 1

  workflow-narrator:
    name: Workflow Narrator 🔉
    needs: [labeler, quality]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      NEEDS_CONTEXT: ${{ toJson(needs) }}
      COMMENT_TITLE: "Continuous Integration - ${{ github.base_ref }}"
      BRANCH_NAME: ${{ github.head_ref }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { BRANCH_NAME, GITHUB_REPOSITORY, GITHUB_SERVER_URL, NEEDS_CONTEXT } = process.env;
            const { owner, repo } = context.repo;

            const isFork = context.payload.pull_request?.head?.repo?.full_name !== `${owner}/${repo}`;

            const narratorContext = {
              commentDelimiter: "<!-- gha:workflow-summary -->",
              commentTitle: `## Workflow Narrator - (${BRANCH_NAME})`,
              branchName: BRANCH_NAME,
              workflowURL: `${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${context.runId}`,
              issueNumber: context.payload.pull_request?.number,
              needsContext: JSON.parse(NEEDS_CONTEXT)
            };

            if (!narratorContext.issueNumber) {
              core.setFailed('Workflow Narrator requires a pull request context.');
              return;
            }


            const summaryLines = [
              narratorContext.commentDelimiter,
              narratorContext.commentTitle,
              '',
              '| Job | Result | Logs |',
              '| --- | --- | --- |',
            ];

            const icons = new Map([
              ['success', ':heavy_check_mark:'],
              ['failure', ':x:'],
              ['cancelled', ':no_entry:'],
              ['skipped', ':fast_forward:'],
            ]);

            let allJobsSucceeded = true;
            Object.entries(narratorContext.needsContext)
              .forEach(([jobName, { result }]) => {
                const resultIcon = icons.get(result) ?? ':grey_question:';
                const resultTitle = result.charAt(0).toUpperCase() + result.slice(1);
                const viewLogsMessage = `[:page_facing_up: View Logs](${narratorContext.workflowURL})`;

                summaryLines.push(`| ${jobName} | ${resultIcon} ${resultTitle} | ${viewLogsMessage} |`);
                const passed = result === 'success' || (jobName === 'labeler' && result === 'skipped');
                allJobsSucceeded &&= passed;
              });

            const footer = allJobsSucceeded
              ? ':heavy_check_mark: Workflow Succeeded'
              : ':warning: Workflow Did Not Succeed';

            summaryLines.push('', footer);

            const commentBody = summaryLines.join('\n');

            await core.summary.addRaw(commentBody, true).write();

            if (!isFork) {
              const commentsFound = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: narratorContext.issueNumber, per_page: 100 },
              );

              const existingComment = commentsFound.find(
                ({ body }) => body?.includes(narratorContext.commentDelimiter)
              );

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body: commentBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: narratorContext.issueNumber,
                  body: commentBody,
                });
              }
            }

            if (!allJobsSucceeded) {
              core.setFailed('One or more required jobs did not succeed.');
            }
