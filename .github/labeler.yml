plugin:vibe-code:
  - changed-files:
      - any-glob-to-any-file: plugins/vibe-code/**

plugin:python-harness:
  - changed-files:
      - any-glob-to-any-file: plugins/python-harness/**

ci:
  - changed-files:
      - any-glob-to-any-file: .github/**

tooling:
  - changed-files:
      - any-glob-to-any-file:
          - scripts/**
          - Makefile
          - pyproject.toml
          - uv.lock
          - .*.toml
          - .coveragerc.ini
          - .pre-commit-config.yaml

docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - "*.md"
