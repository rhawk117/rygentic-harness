line-length = 100
indent-width = 4
src = ["plugins"]
extend-include = ["plugins/vibe-code/bin/vibe-code"]
extend-exclude = [
    "plugins/**/assets/*.template.py",
    "plugins/**/assets/template/**",
]
per-file-target-version = { "plugins/*/skills/**" = "py312", "plugins/vibe-code/bin/vibe-code" = "py312", "plugins/vibe-code/src/**" = "py312", "plugins/vibe-code/tests/**" = "py312" }
force-exclude = true
show-fixes = true
unsafe-fixes = true
fix = true

[lint]
preview = true
explicit-preview-rules = true
extend-select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "EXE",
    "F",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "RET",
    "RSE",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "COM818",
    "ISC001",
    "PLR0904",
    "PLR0914",
    "PLR0916",
    "PLR1702",
    "PLW0717",
    "PT029",
    "pytest-fixture-autouse",
]


ignore = [
    "E111",  # conflicts with the formatter, which owns indentation
    "E114",  # conflicts with the formatter, which owns indentation
    "E117",  # conflicts with the formatter, which owns indentation
    "W191",  # conflicts with the formatter, which owns indentation
    "T201",  # every print the rule reports is in the vibe-code plugin, whose CLI writes to stdout
]


[lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",  # tests are written as bare assert statements
    "PLR2004",  # tests compare against literal expected values
    "PLR0913",  # test functions and helpers take many fixtures as arguments
    "PLR0917",  # test functions and helpers take many positional fixtures
    "FBT001",  # test helpers and parametrized tests take boolean positional flags
    "TID251",  # tests write input and read output back with the standard library, independent of the codec under test
]
"plugins/python-harness/**" = [
    "TID251",  # the json ban belongs to the mightymodels plugin (issue #17); this plugin has no codec and uses the standard library
]
"plugins/vibe-code/**" = [
    "TID251",  # the json ban belongs to the mightymodels plugin (issue #17); this plugin has no codec and uses the standard library
]

[lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
mypy-init-return = false
suppress-dummy-args = false
suppress-none-returning = false

[lint.flake8-bandit]
check-typed-exception = true

[lint.flake8-builtins]
strict-checking = true

[lint.flake8-import-conventions]
extend-aliases = { sqlalchemy = "sql" }
banned-from = ["sqlalchemy"]

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "tuple"
parametrize-values-type = "list"
parametrize-values-row-type = "tuple"

[lint.flake8-tidy-imports.banned-api]
"json.dumps".msg = "encode with mightymodels_plugin/core/codec.py, which writes JSON on msgspec alone"
"json.dump".msg = "encode with mightymodels_plugin/core/codec.py, which writes JSON on msgspec alone"
"json.loads".msg = "decode with mightymodels_plugin/core/codec.py, which reads JSON on msgspec alone"
"json.load".msg = "decode with mightymodels_plugin/core/codec.py, which reads JSON on msgspec alone"

[lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = ["mightymodels_plugin.tools.request.RequestModel"]

[lint.flake8-unused-arguments]
ignore-variadic-names = false

[lint.mccabe]
max-complexity = 8

[lint.pylint]
max-args = 4
max-positional-args = 3
max-returns = 4
max-branches = 8
max-statements = 25
max-locals = 10
max-bool-expr = 3
max-nested-blocks = 3
max-statements-in-try = 3
max-public-methods = 10


[format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
