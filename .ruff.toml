line-length = 90
preview = false
unsafe-fixes = false
# Fixture template bodies are eval material with intentional style violations, not
# package code. docs/ is published prose. plugins/mightymodels ships to foreign
# harnesses and follows its own conventions; plugins/ai-engineer is first-party code.
extend-exclude = ["evals/src/plugin_evals/templates", "docs", "plugins/mightymodels"]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "FAST",
    "S",
    "ERA",
    "G",
    "ASYNC",
    "PERF",
    "B",
    "TID",
    "SIM",
    "C4",
    "DTZ",
    "PTH",
    "PT",
    "A",
    "LOG",
    "TC",
    "PGH",
    "FURB",
    "RUF",
    "TRY",
    "N",
    "FLY",
    "COM",
    "EXE",
    "PIE",
    "C901",
    "D404",
    "D417",
    "D419",
    "RET",
    "SLF",
    "RSE",
    "PYI",
    "ARG",
    "ANN001",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
    "FBT001",
    "FBT002",
    "YTT",    # Unsafe or fragile Python-version checks
    "BLE",    # Blind Exception/BaseException handling
    "T10",    # Forgotten debugger calls
    "ISC004", # Accidental string concatenation inside collections
    "INP",    # Missing __init__.py files
    "SLOT",   # Missing slots on immutable builtin subclasses
    "PL",     # Ruff's Pylint correctness and structural rules
    "ANN002", # Missing *args annotation
    "ANN003", # Missing **kwargs annotation
    "FBT003", # Positional Boolean at call sites
    "D418",   # Docstring incorrectly attached to @overload
]

ignore = [
    "COM812",
    "PGH003",
    # Python 3.14 lazy annotations plus pydantic-evals' runtime introspection of
    # Evaluator dataclasses make moved-to-TYPE_CHECKING imports a runtime NameError
    # waiting to happen; the TC "move" trio stays off, TC004+ correctness stays on.
    "TC001",
    "TC002",
    "TC003",
    "RUF001",
    "RUF002",
    "RUF003",
    "PLR2004",
    "TRY400",
    "TRY003",
    "TRY301",
    "S101",
    "S104",
    "S105",
    "S106",
]

[lint.per-file-ignores]
# Standalone entry points invoked by path, not an importable package.
"scripts/**/*.py" = ["INP001"]
"tests/**/*.py" = ["ARG001", "ARG002", "INP001", "PLR2004", "S101", "PLC0415"]
# Same conventions as above, mirrored for the ai-engineer plugin's nested scripts/
# and tests/ directories (the unprefixed globs above only match the repo-root trees).
"plugins/ai-engineer/**/scripts/**/*.py" = ["INP001"]
"plugins/ai-engineer/**/tests/**/*.py" = [
    "ARG001",
    "ARG002",
    "ARG005",
    "INP001",
    "PLR2004",
    "S101",
    "PLC0415",
]
# Standalone entry point invoked by path, not under a scripts/ directory; boolean
# flags are finding UB-15, ticketed for a later branch.
"plugins/ai-engineer/skills/build-a-loop/assets/verify_gate.py" = [
    "INP001",
    "FBT001",
    "FBT002",
]
# cli.py/doctor.py import heavy submodules lazily inside each command function so
# that invoking one subcommand does not pay the import cost of every other one.
# C901/PLR0912/PLR0915/PLR0911 on cli.py's 100-line command functions and FBT001/
# FBT002 on doctor.py's boolean flags are finding UB-2/3/4/UB-15, ticketed for a
# later branch.
"plugins/ai-engineer/skills/skill-engineering/skilleng/cli.py" = [
    "PLC0415",
    "C901",
    "PLR0912",
    "PLR0915",
    "PLR0911",
]
"plugins/ai-engineer/skills/skill-engineering/skilleng/doctor.py" = [
    "PLC0415",
    "FBT001",
    "FBT002",
]
# Boolean positional params — finding UB-15, ticketed for a later branch.
"plugins/ai-engineer/skills/skill-engineering/skilleng/workspace.py" = [
    "FBT001",
    "FBT002",
]
"plugins/ai-engineer/skills/skill-engineering/skilleng/hooks.py" = ["FBT001", "FBT002"]
"plugins/ai-engineer/skills/skill-engineering/skilleng/runners/base.py" = [
    "FBT001",
    "FBT002",
]
"plugins/ai-engineer/skills/skill-engineering/skilleng/runners/claude_code.py" = [
    "FBT001",
    "FBT002",
]
"plugins/ai-engineer/skills/skill-engineering/skilleng/runners/copilot_cli.py" = [
    "FBT001",
    "FBT002",
]
"plugins/ai-engineer/skills/skill-engineering/skilleng/stats.py" = ["FBT001", "FBT002"]
# Complexity / too-many-args on the existing 100-line functions (UB-2/3/4) and
# boolean flag params (UB-15) — both ticketed for a later branch.
"plugins/ai-engineer/skills/skill-engineering/skilleng/aggregate.py" = [
    "C901",
    "PLR0912",
]
"plugins/ai-engineer/skills/skill-engineering/skilleng/package.py" = [
    "C901",
    "PLR0912",
    "FBT001",
    "FBT002",
]
"plugins/ai-engineer/skills/skill-engineering/skilleng/skillmd.py" = [
    "C901",
    "PLR0912",
]
"plugins/ai-engineer/skills/skill-engineering/skilleng/report.py" = [
    "PLR0915",
    "FBT001",
    "FBT002",
]
"plugins/ai-engineer/skills/skill-engineering/skilleng/trigger.py" = [
    "C901",
    "PLR0912",
    "PLR0915",
    "PLR0913",
]
"plugins/ai-engineer/skills/writing-agent-rules/scripts/audit_rules.py" = ["PLR0911"]
# Test doubles pass boolean flags positionally to mirror the adapter call sites
# under test — finding UB-15, ticketed for a later branch.
"plugins/ai-engineer/skills/skill-engineering/tests/test_run_loop.py" = [
    "FBT001",
    "FBT002",
]
"plugins/ai-engineer/skills/skill-engineering/tests/test_runners.py" = [
    "FBT001",
    "FBT002",
]
"plugins/ai-engineer/skills/skill-engineering/tests/test_trigger.py" = [
    "FBT001",
    "FBT002",
]

[lint.flake8-tidy-imports]
# Imports inside the package are written as `plugin_evals.*`, never `from .x`.
ban-relative-imports = "all"

[lint.mccabe]
max-complexity = 10

[lint.flake8-type-checking]
exempt-modules = ["typing", "typing_extensions"]
quote-annotations = false
strict = false

runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
    "msgspec.Struct",
]

runtime-evaluated-decorators = [
    "pydantic.validate_call",
    "pydantic.dataclasses.dataclass",
]

[format]
docstring-code-format = true
preview = true
quote-style = "single"
