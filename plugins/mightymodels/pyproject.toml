[project]
name = "mightymcp"
version = "0.9.0"
description = "Stdio MCP server exposing the mightymodels agent fleet to Claude Code"
requires-python = ">=3.14"
authors = [{ name = "BUSYSRE" }]
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.scripts]
mightymcp = "mightymcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mightymcp"]
