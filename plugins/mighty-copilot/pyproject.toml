[project]
name = "mightymodels"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3.0",
    "msgspec>=0.22.0",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.1.3",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mightymodels"
wheel-exclude = ["tests"]
