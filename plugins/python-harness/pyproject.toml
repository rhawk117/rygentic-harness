[project]
name = "python-harness-plugin"
version = "0.2.0"
description = "The CLI behind the python-harness Claude Code plugin: facts about a Python project as JSON, and the plugin's hook handlers"
readme = "README.md"
authors = [{ name = "rhawk117", email = "hawkinsry19@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "tree-sitter>=0.26.0",
    "tree-sitter-bash>=0.25.1",
]

[project.scripts]
python-harness = "python_harness.cli:main"

[project.optional-dependencies]
mcp = [
    "anyio>=4.15.1",
    "beautifulsoup4>=4.15.0",
    "cachetools>=7.2.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "mcp>=2.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rapidfuzz>=3.14.6",
    "sphobjinv>=2.4",
]
data = [
    "duckdb>=1.5.6",
    "msgspec>=0.22.0",
    "numpy>=2.5.3",
    "polars>=2.0.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-name = "python_harness"
wheel-exclude = ["tests", "**/tests/**", "**/tests"]
