# yaml-language-server: $schema=behavior.schema.json
name: mightymodels-behavior-finish-assembly
cases:
- name: finish-assembly-lint-fail
  inputs:
    case: finish-assembly-lint-fail
    skill: finish-assembly
    fixture: fx-finish
    task: 'The sprint on ticket .mightymodels/rate-limit is complete — see its REPORT.md.
      Finish the sprint. gitty-up is simulated: at the point you would dispatch it,
      read canned/gitty-up-report.xml as its returned report and proceed from there.'
    sim_notes: 'Environment constraints: worker subagents are unavailable — when the
      process calls for dispatching a worker, write the exact dispatch prompt you
      would send to the tickets dispatches/ directory instead, then continue per the
      case instructions. gh and git push are unavailable: fall back gracefully and
      surface the exact commands a user would run.'
  metadata:
    skill: finish-assembly
  expected_output: null
  evaluators:
  - GlobFileContainsAll:
      check: lint routed to budgetron with Fix/Verify
      pattern: .mightymodels/rate-limit/dispatches/*
      name_regex: budgetron
      needles:
      - 'Fix:'
      - 'Verify:'
  - GitDiffEmpty:
      check: no direct source patch
      pathspec: src
  - GitCommitsTouchingAtMost:
      check: no source commits by the finish session
      pathspec: src
  - NoGlobFileContains:
      check: mechanical case not sent to whats-broken
      pattern: .mightymodels/rate-limit/dispatches/*
      needle: whats-broken
evaluators: []
report_evaluators: []
