# yaml-language-server: $schema=behavior.schema.json
name: mightymodels-behavior-formulate-plan
cases:
- name: formulate-plan-large-ticket
  inputs:
    case: formulate-plan-large-ticket
    skill: formulate-plan
    fixture: fx-plan
    task: 'Session start on the active mightymodels ticket at .mightymodels/queue-overhaul
      (scope large, plan-first true). Ramp it as the process dictates. Scout simulation:
      perform the claim verifications yourself. Stop wherever the process requires
      a user decision — the user is away; state clearly what you are waiting for.'
    sim_notes: ''
  metadata:
    skill: formulate-plan
  expected_output: null
  evaluators:
  - FileRegexCount:
      check: tasks enumerated with size hints
      path: .mightymodels/queue-overhaul/plan.md
      pattern: \((sm|med|large)\)
      minimum: 3
  - FileContains:
      check: non-goals section present
      path: .mightymodels/queue-overhaul/plan.md
      needle: on-goals
  - FileRegex:
      check: plan is citation-free
      path: .mightymodels/queue-overhaul/plan.md
      pattern: \.py:\d+
      expect: false
  - PathAbsent:
      check: loop not started before approval
      path: .mightymodels/queue-overhaul/briefs
  - ResponseContainsAny:
      check: waits on user approval
      needles:
      - approv
      - Approv
evaluators: []
report_evaluators: []
