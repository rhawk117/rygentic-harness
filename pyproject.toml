[project]
name = "rygentic-harness-plugins"
version = "0.1.0"
description = "The Claude Code plugin marketplace for my custom agentic tooling and harnessing"
readme = "README.md"
authors = [
    { name = "rhawk117", email = "noplaceLike127dot0dot0dot1@proton.me" },
]
requires-python = ">=3.14"
repository = "https://github.com/rhawk117/rygentic-harness"
dependencies = []


[dependency-groups]
check = [
    "mdformat>=1.0.0",
    "mdformat-frontmatter>=2.1.2",
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "types-cachetools>=7.0.0.20260713",
]
test = [
    "hypothesis>=6.168.3",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "pytest-randomly>=5.0.0",
    "pytest-xdist>=3.8.0",
    "python-harness-plugin[mcp]",
]
dev = [{ include-group = "check" }, { include-group = "test" }]

[tool.uv]
default-groups = ['dev']

[tool.uv.workspace]
members = [
    "plugins/mightymodels",
    "plugins/vibe-code",
    "plugins/python-harness",
]

[tool.uv.sources]
python-harness-plugin = { workspace = true }
