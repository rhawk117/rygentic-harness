[project]
name = "plugin-evals"
version = "0.6.0"
description = "Eval harness for the marketplace's registered plugins: pydantic-evals datasets, deterministic fixtures, executor-pluggable runs, consolidated HTML reports"
requires-python = ">=3.14"
authors = [{ name = "BUSYSRE" }]
dependencies = [
    "pydantic-evals>=2.32",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
plugin-evals = "plugin_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals/src/plugin_evals"]

[dependency-groups]
lint = [
    "ruff>=0.14",
    "ty>=0.0.73",
]
test = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-mock>=3.15",
    "pytest-randomly>=4.0",
    "pytest-xdist>=3.8",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "pre-commit>=4.0",
]

[tool.uv]
default-groups = ["dev"]

# hook-facing scripts under scripts/ stay 3.12-compatible; the package itself is 3.14
[tool.uv.dependency-groups]
dev = { requires-python = ">=3.14" }
lint = { requires-python = ">=3.14" }

[tool.ty.environment]
python-version = "3.14"
root = ["evals/src", "tests"]

[tool.ty.src]
# fixture template bodies are eval material with intentional violations, not package
# code; skills/ scripts ship to foreign harnesses and follow their own conventions
exclude = ["evals/src/plugin_evals/templates", "plugins"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
# would-be-warnings that have caught real bugs in this repo; keep them hard errors
possibly-unresolved-reference = "error"
unused-ignore-comment = "error"
division-by-zero = "error"
redundant-cast = "error"
# suppression hygiene (adopted from humansays): every ignore is targeted and alive
blanket-ignore-comment = "error"
ignore-comment-unknown-rule = "error"
invalid-ignore-comment = "error"
unused-type-ignore-comment = "error"
deprecated = "error"
